[Rainmeter]
DefaultUpdateDivider=-1
AccurateText=1
@IncludeSettings=#@#settings.inc
OnRefreshAction=[!Draggable "0"][!ClickThrough "1"][!ZPos "2"][!ClickThrough "1"][!SetTransparency "230"]

[Metadata]
Name=激活 Windows
Author=Reisir, edited by aa76
Information=显示未激活设备上的“激活 Windows”水印，现已支持简体中文。
Version=1.1.0
License=CC-NC-SA

[Style]
AntiAlias=1
FontColor=191,191,191,200
SolidColor=0,0,0,1
FontFace=Segoe UI

[FirstLineStyle]
FontSize=15
X=#FirstLineX#
Y=#FirstLineY#

[SecondLineStyle]
; Windows uses FontSize 11,3 but rainmeter rounds down to an integer
; So we use CharacterSpacing to workaround the limitation
FontSize=11
InlineSetting=CharacterSpacing | 0.11
Y=0R
X=0r

[IncludeLanguage]
@IncludeLanguage=#@#lang\[#LANGUAGE].inc

[Background]
Meter=Image
W=#SCREENAREAWIDTH#
H=#SCREENAREAHEIGHT#
SolidColor=0,0,0,0

[FirstLine]
Meter=String
Text=[#FirstLine]
MeterStyle=Style | FirstLineStyle
DynamicVariables=1

[SecondLine]
Meter=String
Text=[#SecondLine]
MeterStyle=Style | SecondLineStyle
DynamicVariables=1
